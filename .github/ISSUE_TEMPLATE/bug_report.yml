name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use only synthetic data. Do not paste credentials, real scan output, reports,
        logs, cloud identifiers, or screenshots containing real data.
        Security issues go through the private channel in SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ./docker-up.sh -d
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, Docker/Colima version, and which optional integrations are enabled.
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: This issue contains no credentials, real scan output, or customer data.
          required: true
