name: Feature request
description: Suggest an improvement to the review workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What review or reporting task is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Note any data that would leave the deployment.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
