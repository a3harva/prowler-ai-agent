[project]
name = "prowler-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "pydantic>=2.12.5",
    "pydantic-settings==2.7.0",
    "google-cloud-secret-manager==2.21.1",
    "pyjwt>=2.13.0",
    "google-auth>=2.56.3",
    "requests>=2.34.2",
    "itsdangerous>=2.2.0",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "bcrypt>=4.2.0",
    "google-genai>=2.19.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.4",
    "langfuse>=4.15.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
