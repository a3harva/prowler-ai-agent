services:
  postgres:
    image: postgres:16-alpine
    # Data lives in a host bind mount rather than a named volume, so it
    # survives `docker volume prune`, a Colima reset, and anything short of
    # deleting the directory — and you can see it on disk.
    #
    # PGDATA deliberately points at a *subdirectory* of the mount. The
    # container creates and owns `pgdata` itself, so Postgres never has to
    # care who owns the bind-mount root — which is what breaks the naive
    # version of this on macOS, where the host directory belongs to the
    # desktop user and Postgres runs as uid 999 and refuses to start.
    #
    # Works identically on Linux (native Docker) and macOS (Colima), because
    # the repo lives under $HOME and Colima mounts $HOME into its VM by
    # default. A checkout outside $HOME would not resolve.
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build: ./backend
    # One container, two Celery workers on disjoint queues — scans at
    # MAX_CONCURRENT_SCANS, reports at MAX_CONCURRENT_REPORTS. Both numbers
    # come from app/config.py, not from a flag here where they would drift
    # from what the loader resolves. See app/worker/run_worker.py for why the
    # split exists and why the two processes live and die together.
    command: python -m app.worker.run_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
      - frontend
